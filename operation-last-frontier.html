<!--
=====================================================================
  OPERATION: LAST FRONTIER — 0.4.0 · Ranking Global online  (arquivo único, sem dependências)
=====================================================================
  COMO JOGAR: abra este arquivo em um navegador moderno (Chrome, Edge, Firefox).
  Funciona offline. O progresso é salvo automaticamente no LocalStorage.

  COMO ATUALIZAR (guia para futuras versões)
  - O script abaixo é dividido em MÓDULOS numerados (procure por "MÓDULO NN"):
      00 Dados/Config  · 01 Core (entrada, save, áudio) · 02 Sprites · 03 Mundo
      04 Combate · 05 Jogador · 06 Inimigos/IA · 07 Progressão · 08 Missões
      09 Render/HUD · 10-11 Interface · 12 Online (ranking global) · 99 Loop principal
      Expansão (sufixo b/c/_exp): 00b dados · 03b mundo Cryon/Vulkar · 03c ambiente + pontos de interesse
      04b zonas/campos/status · 05b corpo a corpo e esquiva · 05c armas experimentais · 06b IA dos novos inimigos
      07b conquistas/bestiário/fabricação · 08b missões novas · 08c modificadores · 09b render/HUD novo · 11b telas novas
  - Novo planeta/facção/inimigo: PLANETS (com pool), FACTIONS, ENEMIES (campo ai + BIO) em 00b; escreva a IA em EnemyAI (06b) e o
    gerador visual em ENEMY_GEN (02b). Novo modificador: MODIFIERS (00b) + efeito em Mods (08c). Nova conquista: ACHIEVEMENTS com
    goal:{k,n} e chame Ach.add(k) no evento. Nova arma branca: MELEE. Nova arma experimental: WEAPONS slot 'exp' + Weapons2 (05c).
  - Novo conteúdo = nova entrada nas tabelas do MÓDULO 00 (WEAPONS, SUPPORTS,
    ENEMIES, VARIANTS, PLANETS, MISSIONS, SKINS, COSMETICS, TECHS, ACHIEVEMENTS).
    Os menus (arsenal, hangar, laboratório...) se atualizam sozinhos.
  - Balanceamento: CFG, DIFFICULTIES e os números de cada tabela (MÓDULO 00).
  - Visão/IA dos inimigos: CFG.vision (alcance, áudio, memória) e sight/fov em ENEMIES (MÓDULO 00); lógica em MÓDULO 06 ("Percepção").
  - Save: mude SAVE_VERSION e adicione a migração em SaveSys.migrate (MÓDULO 01).
  - Multiplayer: lógica de combate (04-08) é separada da interface (09-11).
  - Ranking global: MÓDULO 12 (Online) + supabase/ranking.sql. Ao criar missão/dificuldade/modificador, regenere o SQL (tools/make_ranking_sql.js)
    e rode-o de novo no Supabase — senão o servidor recusa a combinação nova (o jogo continua funcionando, só não pontua online).
  - Versão/notas: VERSION e CHANGELOG (MÓDULO 00).
=====================================================================
-->

const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}

const U = {
  rand: (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a)),
  randi: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  dist2: (x1, y1, x2, y2) => (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1),
  angDiff: (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; },
  fmtTime: (s) => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); },
  fmtNum: (n) => Math.round(n).toLocaleString('pt-BR'),
  mulberry32: (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; },
  hash2: (x, y) => { let n = (x * 374761393 + y * 668265263) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; },
  weighted: (entries) => { let tot = 0; for (const e of entries) tot += e[1]; let r = Math.random() * tot; for (const e of entries) { r -= e[1]; if (r <= 0) return e[0]; } return entries[entries.length - 1][0]; },
  isoWeek: (d = new Date()) => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return t.getUTCFullYear() + '-W' + String(Math.ceil(((t - y0) / 864e5 + 1) / 7)).padStart(2, '0'); },
  deep: (o) => JSON.parse(JSON.stringify(o)),
  merge: (def, obj) => { // preenche chaves ausentes (compatibilidade com saves antigos)
    if (obj == null || typeof obj !== 'object' || Array.isArray(def)) return obj === undefined ? U.deep(def) : obj;
    const out = {}; for (const k in def) out[k] = (k in obj) ? (typeof def[k] === 'object' && def[k] && !Array.isArray(def[k]) ? U.merge(def[k], obj[k]) : obj[k]) : U.deep(def[k]);
    for (const k in obj) if (!(k in out)) out[k] = obj[k];
    return out;
  }
};

/* ---------------- Entrada ---------------- */
const Input = {
  keys: new Set(), pressed: new Set(), mouse: { sx: 0, sy: 0, down: false, pressed: false, right: false }, wheel: 0, enabled: true, _byCode: {},
  init() {
    for (const act in CFG.keys) for (const c of CFG.keys[act]) (this._byCode[c] = this._byCode[c] || []).push(act);
    addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (Game && Game.state === 'mission' && ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
      if (!e.repeat) { this.pressed.add(e.code); for (const a of (this._byCode[e.code] || [])) this.pressed.add('@' + a); }
      this.keys.add(e.code);
    });
    addEventListener('keyup', (e) => this.keys.delete(e.code));
    addEventListener('blur', () => { this.keys.clear(); this.mouse.down = false; if (Game && Game.state === 'mission') Game.pause(true); });
    const cv = $('hud');
    const upd = (e) => { const r = cv.getBoundingClientRect(); this.mouse.sx = e.clientX - r.left; this.mouse.sy = e.clientY - r.top; };
    addEventListener('mousemove', upd);
    addEventListener('mousedown', (e) => { upd(e); if (Game.state !== 'mission' || Game.paused) return; if (e.button === 0) { this.mouse.down = true; this.mouse.pressed = true; } if (e.button === 2) this.mouse.right = true; });
    addEventListener('mouseup', (e) => { if (e.button === 0) this.mouse.down = false; if (e.button === 2) this.mouse.right = false; });
    addEventListener('wheel', (e) => { if (Game.state === 'mission') this.wheel += Math.sign(e.deltaY); }, { passive: true });
    addEventListener('contextmenu', (e) => { if (Game.state === 'mission') e.preventDefault(); });
  },
  down(act) { for (const c of CFG.keys[act]) if (this.keys.has(c)) return true; return false; },
  hit(act) { return this.pressed.has('@' + act); },
  endStep() { this.pressed.clear(); this.mouse.pressed = false; this.wheel = 0; },
  virtual: null   // usado pelo piloto automático de testes: { mx,my,fire,... }
};

  stop() { this.cur = null; },

 * Cryon: gelo escorregadio, gelo fino que quebra, água gelada, tempestades de neve localizadas, cristais energizados,
 *        cristais destrutíveis (cobertura), depósitos minerais.
 * Vulkar: lava, fissuras térmicas (aviso → jato), erupções localizadas, nuvens de cinzas, máquinas superaquecidas,
 *        tanques explosivos, depósitos térmicos. Contenção térmica (missão) reduz os perigos via Env.hazMul.
 * ===================================================================== */
const Env = {
  clouds: [], fissures: [], machines: [], thin: new Map(), frame: 0, stormT: 30, eruptT: 20, hazMul: 1, tickT: 0, burnTick: 0, waterTick: 0, lavaTick: 0, warnT: 0, deposits: 0,
  reset() { this.clouds = []; this.fissures = []; this.machines = []; this.thin = new Map(); this.frame = 0; this.stormT = U.rand(22, 38); this.eruptT = U.rand(16, 26); this.hazMul = 1; this.tickT = 0; this.warnT = 0; this.deposits = 0; },
  tileAt(x, y) { const tx = (x / T) | 0, ty = (y / T) | 0; if (x < 0 || y < 0 || tx >= World.w || ty >= World.h) return 1; return World.tiles[ty * World.w + tx]; },
  iceAt(x, y) { const t = this.tileAt(x, y); return t === 6 || t === 8; },
  lavaAt(x, y) { return this.tileAt(x, y) === 10; }, waterAt(x, y) { return this.tileAt(x, y) === 9; },
  lavaOnLine(x0, y0, x1, y1) { const d = Math.hypot(x1 - x0, y1 - y0), n = Math.min(24, Math.ceil(d / 8)); for (let i = 1; i <= n; i++) { const t = i / n; if (this.tileAt(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t) === 10) return true; } return false; },
  playerSpeedMul(p) { if (!World.hasIce && !World.hasLava) return 1; const t = this.tileAt(p.x, p.y); return t === 9 ? 0.6 : t === 10 ? 0.7 : 1; },
  inCloud(x, y) { for (const c of this.clouds) { const k = this.cloudK(c); if (k > 0.3 && U.dist2(x, y, c.x, c.y) < (c.r * c.r)) return c; } return null; },
  cloudK(c) { return Math.min(1, c.age / 3, c.max === Infinity ? 1 : c.t / 3); },
  fogMul(e, p) { if (!this.clouds.length) return 1; return (this.inCloud(e.x, e.y) || this.inCloud(p.x, p.y)) ? 0.55 : 1; },
  addCloud(kind, x, y, r, vx, vy, t) { this.clouds.push({ kind, x, y, r, vx, vy, t, max: t, age: 0 }); },

  /* ---------- criação dos elementos do mapa ---------- */
  populate(m) {
    const id = World.planet.id, d = m.diffDef, sp = World.spawn, lz = World.lz, avoid = [[sp.x, sp.y, 110], [lz.x, lz.y, 120]], taken = () => avoid.concat(Ent.props.map(q => [q.x, q.y, 22]));
    const place = (kind, n, o, minGap = 22, extra) => { for (let i = 0; i < n; i++) { const s = World.pickSpot({ avoid: taken(), tries: 70, open3: !!(o && o.open3) }); if (!s) continue; const pr = makeProp(kind, s.x, s.y, Object.assign({ ext: true }, o)); if (extra) extra(pr, i); } };
    if (id === 'cryon') {
      const cr = (pr) => { pr.onDestroy = () => { Fx.spark(pr.x, pr.y, 0, 12, '#cfeaff', 130); Fx.ring(pr.x, pr.y, 14, '#9ad8ff', 0.3); Snd.play('crystal', 0.8); Fx.text(pr.x, pr.y - 8, 'CRISTAL QUEBRADO', '#bfe8ff'); }; };
      place('crystal', 26, { r: 7, cr: 6, hp: 80, hittable: true, solid: true, cover: true, hue: 0 }, 22, (pr) => { pr.hue = Math.random(); cr(pr); });
      place('ecrystal', 9, { r: 8, cr: 7, hp: 130, hittable: true, solid: true, cover: true, hits: 0, hitWin: 0, pulse: 0, charge: 0, open3: true }, 40, (pr) => { pr.onHit = (q) => { q.hits++; q.hitWin = 3.2; q.pulse = 0.5; if (q.hits >= 5 && !q.dead) { q.hp = 0; } }; pr.onDestroy = () => this.crystalBoom(pr); });
      place('deposit', 6, { r: 8, cr: 0, hp: 1, hittable: false, solid: false, item: 'lithari_frag', rare: 'crystal_core' }, 40);
    } else if (id === 'vulkar') {
      place('tank', 10, { r: 7, cr: 7, hp: 45, hittable: true, solid: true }, 30, (pr) => { pr.onDestroy = () => { explode(pr.x, pr.y, 54, 115, { owner: 'p', self: 0.7, barrel: true }); Mis.onBarrel(pr); Fx.text(pr.x, pr.y - 10, 'TANQUE EXPLOSIVO', '#ffb060'); }; });
      for (let i = 0; i < 6; i++) { const s = World.pickSpot({ avoid: taken(), tries: 70, open3: true }); if (!s) continue; const pr = makeProp('machine', s.x, s.y, { ext: true, r: 9, cr: 8, hp: 1, hittable: false, solid: true }); this.machines.push({ x: s.x, y: s.y, st: 'idle', t: U.rand(2, 7), r: 28, pr }); }
      for (let i = 0; i < 8; i++) { const s = World.pickSpot({ avoid: taken().concat(this.fissures.map(f => [f.x, f.y, 60])), tries: 70 }); if (s) this.fissures.push({ x: s.x, y: s.y, st: 'idle', t: U.rand(2, 9), r: 15, seed: Math.random() * 6 }); }
      place('deposit', 6, { r: 8, cr: 0, hp: 1, hittable: false, solid: false, item: 'igneous_residue', rare: 'vulcan_core' }, 40);
      for (let i = 0; i < 4; i++) this.addCloud('ash', U.rand(300, World.w * T - 300), U.rand(300, World.h * T - 300), U.rand(70, 105), U.rand(-7, 7), U.rand(-7, 7), Infinity);
    }
    if (Mods.has('ash')) for (let i = 0; i < 5; i++) this.addCloud('ash', U.rand(200, World.w * T - 200), U.rand(200, World.h * T - 200), U.rand(80, 120), U.rand(-8, 8), U.rand(-8, 8), Infinity);
  },
  crystalBoom(pr) {
    Fx.explosion(pr.x, pr.y, 18); Fx.ring(pr.x, pr.y, 40, '#80e0ff', 0.4); Cam.kick(5); Snd.play('zap', 0.9); Mis.noise(pr.x, pr.y, 220);
    Grid.query(pr.x, pr.y, 60, (e) => { if (e.state === 'dying' || e.under) return; const dd = U.dist(pr.x, pr.y, e.x, e.y); if (dd < 52) { damageEnemy(e, 70 * (1 - dd / 90), 'energy', { ang: Math.atan2(e.y - pr.y, e.x - pr.x), kb: 120, src: 'ecrystal' }); Fx.beam(pr.x, pr.y, e.x, e.y, '#80e0ff'); } });
    const p = Ent.player; if (p.alive && U.dist(pr.x, pr.y, p.x, p.y) < 44) { hurtPlayer(24 * Mis.diffDef.dmg, Math.atan2(p.y - pr.y, p.x - pr.x)); Fx.beam(pr.x, pr.y, p.x, p.y, '#80e0ff'); }
    for (const q of Ent.props) if (q !== pr && !q.dead && q.kind === 'ecrystal' && U.dist(pr.x, pr.y, q.x, q.y) < 40) { q.hits += 2; q.pulse = 0.6; Fx.beam(pr.x, pr.y, q.x, q.y, '#80e0ff'); if (q.hits >= 5) damageProp(q, 9999, 'energy'); }
  },
  /* impacto pesado em (x,y): rachaduras no gelo fino */
  onImpact(x, y, r, heavy) {
    if (!World.hasIce) return; const tr = Math.ceil(r / T) + 1, cx = (x / T) | 0, cy = (y / T) | 0;
    for (let j = -tr; j <= tr; j++) for (let i = -tr; i <= tr; i++) { const tx = cx + i, ty = cy + j; if (tx < 0 || ty < 0 || tx >= World.w || ty >= World.h) continue; if (World.tiles[ty * World.w + tx] !== 8) continue; if (U.dist((tx + 0.5) * T, (ty + 0.5) * T, x, y) > r + 4) continue; const k = ty * World.w + tx, en = this.thin.get(k) || { t: 0, stamp: this.frame }; en.t = Math.max(en.t, CFG.env.lakeCrack * (heavy ? 0.95 : 0.55)); en.stamp = this.frame; this.thin.set(k, en); }
  },
  crackTile(tx, ty) {
    const k = ty * World.w + tx; this.thin.delete(k); World.setTileLive(tx, ty, 9); const x = (tx + 0.5) * T, y = (ty + 0.5) * T; Fx.ring(x, y, 12, '#d8f2ff', 0.35); Fx.spark(x, y, 0, 10, '#d8f2ff', 90); Snd.play('crystal', 0.5);
    for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = tx + a, ny = ty + b; if (World.tiles[ny * World.w + nx] === 8 && Math.random() < 0.35) { const kk = ny * World.w + nx, en = this.thin.get(kk) || { t: 0, stamp: this.frame }; en.t = Math.max(en.t, CFG.env.lakeCrack * 0.6); en.stamp = this.frame; this.thin.set(kk, en); } }
    const p = Ent.player; if (p.alive && ((p.x / T) | 0) === tx && ((p.y / T) | 0) === ty) { hurtPlayer(7 * Mis.diffDef.dmg, 0, true); p.slowT = 1.6; Mis.notify('GELO QUEBROU — ÁGUA GELADA', '#9ad8ff'); Fx.text(p.x, p.y - 14, 'GELO QUEBROU!', '#9ad8ff', 2); }
  },

  /* ---------- atualização ---------- */
  update(dt) {
    const p = Ent.player, m = Mis, D = m.diffDef, id = World.planet.id; this.frame++;
    if (m.phase === 'insert') return;
    // nuvens (neve / cinzas)
    for (let i = this.clouds.length - 1; i >= 0; i--) { const c = this.clouds[i]; c.age += dt; c.x += c.vx * dt; c.y += c.vy * dt; if (c.t !== Infinity) { c.t -= dt; if (c.t <= 0) { this.clouds.splice(i, 1); continue; } } else { if (c.x < 160 || c.x > World.w * T - 160) c.vx = -c.vx; if (c.y < 160 || c.y > World.h * T - 160) c.vy = -c.vy; } }
    if (id === 'cryon') { this.stormT -= dt; if (this.stormT <= 0 && !m.over) { this.stormT = U.rand(CFG.env.stormEvery[0], CFG.env.stormEvery[1]); const a = Math.random() * 6.28, d0 = U.rand(110, 220), len = U.rand(CFG.env.stormLen[0], CFG.env.stormLen[1]); this.addCloud('snow', p.x + Math.cos(a) * d0, p.y + Math.sin(a) * d0, 135, -Math.cos(a) * 9, -Math.sin(a) * 9, len); m.warn('TEMPESTADE DE NEVE PRÓXIMA — VISÃO REDUZIDA'); } }
    if (id === 'vulkar') { this.eruptT -= dt * this.hazMul; if (this.eruptT <= 0 && !m.over && p.alive) { this.eruptT = U.rand(CFG.env.eruptionEvery[0], CFG.env.eruptionEvery[1]); this.eruption(p, D); } this.updateFissures(dt, p, D); this.updateMachines(dt, p, D); }
    // efeitos do terreno (jogador)
    if (p.alive && p.drop <= 0) {
      const t = this.tileAt(p.x, p.y);
      if (t === 10) { this.lavaTick -= dt; p.slowT = Math.max(p.slowT, 0.4); p.burnT = 2; if (this.lavaTick <= 0) { this.lavaTick = 0.25; hurtPlayer(CFG.env.lavaDps * 0.25 * D.dmg, 0); if (Ent.time - (this.msgLava || -9) > 2) { this.msgLava = Ent.time; Fx.text(p.x, p.y - 14, 'LAVA!', '#ff7a30', 2); } } Fx.fire(p.x, p.y, 1); }
      else if (t === 9) { this.waterTick -= dt; p.slowT = Math.max(p.slowT, 0.3); if (this.waterTick <= 0) { this.waterTick = 0.5; hurtPlayer(CFG.env.waterDps * 0.5 * D.dmg, 0, true); if (Ent.time - (this.msgWater || -9) > 3) { this.msgWater = Ent.time; Fx.text(p.x, p.y - 14, 'ÁGUA GELADA', '#9ad8ff', 2); } } if (Math.random() < dt * 12) Fx.add(p.x + U.rand(-4, 4), p.y + 3, 0, -6, 0.4, 1, '#d8f2ff', { drag: 1 }); }
      else if (t === 8) { const k = ((p.y / T) | 0) * World.w + ((p.x / T) | 0), en = this.thin.get(k) || { t: 0, stamp: 0 }; en.t += dt * (p.sprint ? 1.7 : 1); en.stamp = this.frame; this.thin.set(k, en); }
      if (p.burnT > 0) { p.burnT -= dt; this.burnTick -= dt; if (this.burnTick <= 0) { this.burnTick = 0.4; hurtPlayer(1.7 * D.dmg, 0, true); Fx.fire(p.x, p.y, 1); } }
    }
    // inimigos: lava, água, peso no gelo fino (a cada 0.25 s)
    this.tickT -= dt; if ((World.hasIce || World.hasLava) && this.tickT <= 0) {
      this.tickT = 0.25;
      for (const e of Ent.enemies) { if (e.state === 'dying' || e.under) continue; const t = this.tileAt(e.x, e.y);
        if (t === 10 && !e.def.fireProof) { damageEnemy(e, 26 * 0.25, 'fire', { src: 'lava' }); Fx.fire(e.x, e.y, 1); if (Math.random() < 0.15) Fx.text(e.x, e.y - e.r - 6, 'LAVA!', '#ff7a30'); }
        else if (t === 9 && !e.def.iceProof) Status.slow(e, 0.55, 0.5);
        else if (t === 8 && (e.def.mass || 1) >= 1) { const k = ((e.y / T) | 0) * World.w + ((e.x / T) | 0), en = this.thin.get(k) || { t: 0, stamp: 0 }; en.t += 0.25 * (e.def.mass || 1) * 0.8; en.stamp = this.frame; this.thin.set(k, en); } }
    }
    // gelo fino: acumula tempo e quebra; sem pressão, recupera aos poucos
    if (this.thin.size) for (const [k, en] of this.thin) { if (en.stamp !== this.frame) { en.t -= dt * 0.6; if (en.t <= 0) { this.thin.delete(k); continue; } } if (en.t >= CFG.env.lakeCrack) this.crackTile(k % World.w, (k / World.w) | 0); }
    // cristais energizados: pulsam com criaturas por perto
    if (id === 'cryon') for (const pr of Ent.props) { if (pr.kind !== 'ecrystal' || pr.dead) continue; if (pr.pulse > 0) pr.pulse -= dt; if (pr.hitWin > 0) { pr.hitWin -= dt; if (pr.hitWin <= 0) pr.hits = 0; } pr.near = (pr.near || 0) - dt; if (pr.near <= 0) { pr.near = 0.4; let n = 0; Grid.query(pr.x, pr.y, 70, (e) => { if (e.state !== 'dying' && !e.under && U.dist2(pr.x, pr.y, e.x, e.y) < 4900) n++; }); if (n && pr.pulse <= 0) { pr.pulse = 0.6; Fx.ring(pr.x, pr.y, 20, '#80e0ff', 0.4); Snd.play('zap', 0.2); } } }
    // prompts e pontos de interesse
    POI.update(dt, p, m); this.updatePrompt(p, m);
    if (this.warnT > 0) this.warnT -= dt;
  },
  eruption(p, D) {
    for (let k = 0; k < 20; k++) { const a = Math.random() * 6.28, d = U.rand(70, 210), x = p.x + Math.cos(a) * d, y = p.y + Math.sin(a) * d; if (World.solidAt(x, y) || this.tileAt(x, y) === 10 || U.dist(x, y, World.lz.x, World.lz.y) < 90 || U.dist(x, y, World.spawn.x, World.spawn.y) < 70) continue;
      Zones.add({ shape: 'circle', x, y, r: 38, warn: 2.4, dmg: 30 * D.dmg, col: '#ff6a20', knock: 130, shake: 7, snd: 'bigexp', erupt: true, onFire: (z) => { Fx.explosion(z.x, z.y, 22); Hazards.add({ x: z.x, y: z.y, r: 30, t: 7, dps: 13 * D.dmg, kind: 'fire', hitsEnemies: true }); World.scorch(z.x, z.y, 12); for (let i = 0; i < 10; i++) Fx.add(z.x, z.y, U.rand(-80, 80), U.rand(-120, -30), 0.8, 2, '#ffb040', { drag: 1.2, glow: 1 }); } });
      Snd.play('tremor', 0.7); Cam.kick(2); m_warn('ERUPÇÃO IMINENTE — AFASTE-SE DA ÁREA MARCADA'); return; }
  },
  updateFissures(dt, p, D) {
    for (const f of this.fissures) {
      f.t -= dt * (f.st === 'idle' ? this.hazMul : 1);
      if (f.st === 'idle') { if (f.t <= 0) { f.st = 'warn'; f.t = 1.3; if (p.alive && U.dist(f.x, f.y, p.x, p.y) < 160 && this.warnT <= 0) { this.warnT = 6; Mis.warn('FISSURA TÉRMICA ATIVANDO'); } Snd.play('steam', 0.25); } }
      else if (f.st === 'warn') { if (Math.random() < dt * 14) Fx.add(f.x + U.rand(-8, 8), f.y + U.rand(-3, 3), U.rand(-8, 8), U.rand(-30, -10), 0.6, 2, 'rgba(255,170,90,.7)', { drag: 1 }); if (f.t <= 0) { f.st = 'jet'; f.t = 1.0; f.tick = 0; Snd.play('steam', 0.7); Cam.kick(1.5); } }
      else { f.tick -= dt; for (let i = 0; i < 2; i++) Fx.add(f.x + U.rand(-5, 5), f.y, U.rand(-20, 20), U.rand(-110, -50), 0.45, 3, Math.random() < 0.5 ? '#ff9a30' : '#ffd060', { drag: 2, glow: 1 });
        if (f.tick <= 0) { f.tick = 0.2; const dmg = 30 * 0.2 * D.dmg * (0.5 + 0.5 * this.hazMul); if (p.alive && U.dist(f.x, f.y, p.x, p.y) < f.r + p.r) { hurtPlayer(dmg, 0); p.burnT = 1.2; } Grid.query(f.x, f.y, f.r + 12, (e) => { if (e.state !== 'dying' && !e.under && !e.def.fireProof && U.dist(f.x, f.y, e.x, e.y) < f.r + e.r) damageEnemy(e, dmg, 'fire', { src: 'fissure' }); }); }
        if (f.t <= 0) { f.st = 'idle'; f.t = U.rand(CFG.env.fissureEvery[0], CFG.env.fissureEvery[1]) * 1.2; } }
    }
  },
  updateMachines(dt, p, D) {
    for (const M of this.machines) {
      M.t -= dt * (M.st === 'idle' ? this.hazMul : 1);
      if (M.st === 'idle') { if (M.t <= 0) { M.st = 'warn'; M.t = 1.2; Snd.play('steam', 0.3); } }
      else if (M.st === 'warn') { if (Math.random() < dt * 10) Fx.add(M.x + U.rand(-6, 6), M.y - 8, U.rand(-10, 10), -25, 0.5, 2, 'rgba(255,255,255,.5)', { drag: 1 }); if (M.t <= 0) { M.st = 'vent'; M.t = 1.4; M.tick = 0; Snd.play('steam', 0.8); } }
      else { M.tick -= dt; for (let i = 0; i < 2; i++) { const a = Math.random() * 6.28; Fx.add(M.x, M.y - 4, Math.cos(a) * 60, Math.sin(a) * 40 - 15, 0.6, 3, 'rgba(255,255,255,.55)', { drag: 2.5, shrink: -2 }); }
        if (M.tick <= 0) { M.tick = 0.25; const dmg = 20 * 0.25 * D.dmg * (0.5 + 0.5 * this.hazMul); if (p.alive && U.dist(M.x, M.y, p.x, p.y) < M.r + p.r) { hurtPlayer(dmg, 0); p.slowT = Math.max(p.slowT, 0.6); } Grid.query(M.x, M.y, M.r + 12, (e) => { if (e.state !== 'dying' && !e.under && !e.def.fireProof && U.dist(M.x, M.y, e.x, e.y) < M.r + e.r) damageEnemy(e, dmg, 'fire', { src: 'machine' }); }); }
        if (M.t <= 0) { M.st = 'idle'; M.t = U.rand(5, 9) * 1.1; } }
    }
  },
  /* ---------- interação [E] (depósitos, pontos de interesse) ---------- */
  nearInteractable(p) {
    let best = null, bd = 26 * 26;
    for (const pr of Ent.props) { if (pr.dead) continue; if (pr.kind === 'deposit' || (pr.kind === 'poilog' && !pr.used) || (pr.kind === 'poi' && !pr.poi.exp && pr.poi.type !== 'installation' && pr.poi.disc)) { const d = U.dist2(p.x, p.y, pr.x, pr.y); if (d < bd) { bd = d; best = pr; } } }
    return best;
  },
  updatePrompt(p, m) { if (!p.alive || m.prompt) return; const pr = this.nearInteractable(p); if (!pr) return; m.prompt = pr.kind === 'deposit' ? '[E] COLETAR DEPÓSITO' : pr.kind === 'poilog' ? '[E] RECUPERAR REGISTRO' : '[E] EXPLORAR — ' + POI_TYPES[pr.poi.type].name.toUpperCase(); },
  interact(p) {
    const pr = this.nearInteractable(p); if (!pr) return false;
    if (pr.kind === 'deposit') { pr.dead = true; this.deposits++; const n = U.randi(2, 4); Hooks.item(pr.item, n); if (Math.random() < 0.14) Hooks.item(pr.rare, 1); Fx.ring(pr.x, pr.y, 16, ITEMS[pr.item].color, 0.4); Fx.spark(pr.x, pr.y, 0, 10, ITEMS[pr.item].color, 100); Snd.play('pickup'); Mis.noise(pr.x, pr.y, 90); return true; }
    if (pr.kind === 'poilog') return POI.log(pr, p); return POI.explore(pr.poi, p);
  }
};
function m_warn(t) { if (Mis) Mis.warn(t); }

const POI = {
  list: [],
  reset() { this.list = []; },
  populate(m) {
    this.list = []; const cnt = CFG.poi.count[m.diffDef.id - 1], sites = World.sites.slice().sort(() => Math.random() - 0.5).slice(0, cnt), pid = World.planet.id;
    const order = { vesta: ['installation', 'depot', 'pod', 'unknown', 'lab'], nox: ['lab', 'pod', 'unknown', 'depot', 'installation'], cryon: ['lab', 'installation', 'pod', 'depot', 'unknown'], vulkar: ['installation', 'depot', 'unknown', 'pod', 'lab'] }[pid] || Object.keys(POI_TYPES), pool = order.slice().sort(() => Math.random() - 0.5);
    sites.forEach((s, i) => {
      const type = pool[i % pool.length], poi = { id: s.id, type, x: s.x, y: s.y, disc: false, exp: false, logs: type === 'installation' ? 3 : 0, got: 0, hx: s.x + U.rand(-60, 60), hy: s.y + U.rand(-60, 60), seed: Math.random() * 9 };
      poi.prop = makeProp('poi', s.x, s.y, { ext: true, r: 10, cr: 0, hp: 1, hittable: false, solid: false, poi });
      if (type === 'installation') for (let k = 0; k < 3; k++) { const a = k * 2.09 + 0.5, x = s.x + Math.cos(a) * 24, y = s.y + Math.sin(a) * 24; if (!World.solidAt(x, y)) makeProp('poilog', x, y, { ext: true, r: 6, cr: 0, hp: 1, hittable: false, solid: false, poi, used: false }); else poi.logs--; }
      this.list.push(poi);
    });

/* ---------- pós-processamento: navegação, flags e posições de pontos de interesse ---------- */

/* ---------- Geração: CRYON ---------- */
World.genExt = {};
World.genExt.cryon = function (rng, cells, cs, sc, lc) {

    if (!isS && !isL) { const r = rng(); kind = r < 0.2 ? 'ruin' : r < 0.46 ? 'lake' : r < 0.76 ? 'crystals' : 'open'; if (kind === 'ruin') ruins++; if (kind === 'lake') lakes++; }

/* ---------------- Projéteis (pool) ---------------- */
const Proj = {

  init() { this.pool = Array.from({ length: CFG.fx.maxProjectiles }, () => ({ a: false, hits: [] })); },
  clear() { for (const p of this.pool) p.a = false; },
  spawn(o) {

  },
  update(dt) {
    for (const p of this.pool) {
      if (!p.a) continue; p.life -= dt; p.age += dt;
      if (p.kind === 'disc') { Weapons2.updateDisc(p, dt); continue; }
      if (p.kind === 'flame') { p.r = 2 + p.age * 16; }
      if (p.kind === 'rocket' && Math.random() < 0.9) { Fx.smoke(p.x - p.vx * 0.02, p.y - p.vy * 0.02, 1, 3); Fx.fire(p.x, p.y, 1); const sp = Math.hypot(p.vx, p.vy); if (sp < 420) { p.vx *= 1 + 1.6 * dt; p.vy *= 1 + 1.6 * dt; } }

      for (let i = 1; i <= n; i++) { const sx = p.x + dx * i / n, sy = p.y + dy * i / n; if (World.solidAt(sx, sy)) { hitWall = true; break; } nx = sx; ny = sy; }
      const x0 = p.x, y0 = p.y;
      if (hitWall) { this.end(p, nx, ny, false); continue; }
      p.x = nx; p.y = ny;
      if (p.kind === 'acid' || p.kind === 'fireball') { if (U.dist2(p.x, p.y, p.tx, p.ty) < 49 || p.age > 1.8) { this.end(p, p.x, p.y, true); continue; } }

  },

  hitEnemies(p, x0, y0, x1, y1) {

    if (p.kind === 'fireball') { Fx.explosion(x, y, 10); Zones.fireZone(x, y, 16, 3.5, 8 * (Mis ? Mis.diffDef.dmg : 1)); Snd.play('splat', 0.4); return; }

/* ---------------- Dano ---------------- */
function damageEnemy(e, dmg, type, o = {}) {

  if (Mis) Mis.stat('damage', dmg);
  if (Ent.time - e.numT > 0.22 || e.hp <= 0) { if (Settings.data.dmgNumbers && e.numAcc >= 1) Fx.text(e.x, e.y - e.r - 6, Math.round(e.numAcc), type === 'fire' ? '#ffa040' : type === 'energy' ? '#80e8ff' : type === 'explosive' ? '#ffd060' : '#ffffff', e.numAcc >= 50 ? 2 : 1); e.numAcc = 0; e.numT = Ent.time; }

    } else if (s.id === 'ammo') {

      Ent.crates.push({ x: tx, y: ty, t: 0.9, used: false }); Snd.play('deploy'); Mis.msg('SUPRIMENTOS A CAMINHO — APROXIME-SE E PRESSIONE [E]', '#ffd040');
    } else if (s.id === 'drone') {

    }

  },
  nearest(x, y, range, needLos) { let best = null, bd = range * range; for (const e of Ent.enemies) { if (e.state === 'dying' || e.under) continue; const d = U.dist2(x, y, e.x, e.y); if (d < bd && (!needLos || World.los(x, y, e.x, e.y))) { bd = d; best = e; } } return best; },
  update(dt) {

/* ---------------- Zonas de ataque (aviso → acerto) ----------------
 * shape: 'circle' | 'cone' | 'line' | 'ring' (onda que se expande). Os ataques de inimigos usam isto para telegrafar a área

  list: [], waves: [],

  add(o) { const z = Object.assign({ shape: 'circle', x: 0, y: 0, r: 30, ang: 0, arc: 90, len: 80, w: 12, warn: 1, t: 0, dmg: 10, col: '#ff5a3a', knock: 0, owner: null, attach: false, ox: 0, oy: 0, kind: 'hit', rock: false, snd: 'slam', shake: 4, breaks: 0 }, o); z.t = z.warn; z.max = z.warn; this.list.push(z); if (this.list.length > 40) this.list.shift(); return z; },

  inside(z, px, py, pr) {

    if (z.shape === 'cone') { const dx = px - z.x, dy = py - z.y, d = Math.hypot(dx, dy); return d <= z.r + pr && (d < pr + 4 || Math.abs(U.angDiff(z.ang, Math.atan2(dy, dx))) <= z.arc * Math.PI / 360 + Math.atan2(pr, Math.max(1, d))); }

    return false;
  },
  /* alguma zona prestes a acertar o jogador? (usado pelo alerta do HUD) */
  threat(p) { let best = null; for (const z of this.list) if (z.t > 0 && z.t < z.max && this.inside(z, p.x, p.y, p.r) && (!best || z.t < best.t)) best = z; return best; },
  update(dt) {
    const p = Ent.player;
    for (let i = this.list.length - 1; i >= 0; i--) {
      const z = this.list[i], o = z.owner;
      if (o && (o.state === 'dying' || o.dead)) { this.list.splice(i, 1); continue; }
      if (z.attach && o) { z.x = o.x + Math.cos(o.ang) * z.ox; z.y = o.y + Math.sin(o.ang) * z.ox; if (z.follow) z.ang = o.ang; }

      const rr = w.r0 + (w.r1 - w.r0) * k; w.rr = rr;
      if (!w.hit && p.alive) { const d = U.dist(w.x, w.y, p.x, p.y); if (Math.abs(d - rr) < 7 + p.r * 0.6) { w.hit = true; hurtPlayer(w.dmg, Math.atan2(p.y - w.y, p.x - w.x)); p.vx += Math.cos(Math.atan2(p.y - w.y, p.x - w.x)) * w.knock; p.vy += Math.sin(Math.atan2(p.y - w.y, p.x - w.x)) * w.knock; } }
      if (Math.random() < 0.5) { const a = Math.random() * 6.28; Fx.add(w.x + Math.cos(a) * rr, w.y + Math.sin(a) * rr, Math.cos(a) * 20, Math.sin(a) * 20, 0.3, 2, w.col, { drag: 3 }); }
    }
  },
  fire(z, p) {

    if (z.shape === 'ring') { this.waves.push({ x: z.x, y: z.y, r0: 6, r1: z.r, t: 0, dur: 0.7, dmg: z.dmg, col: z.col, knock: z.knock, hit: false, rr: 6 }); return; }

  draw(g, cx, cy, time) {

      if (!Render.inView(z.x, z.y, 160)) continue; const k = 1 - z.t / z.max, X = z.x - cx, Y = z.y - cy, pul = 0.5 + 0.5 * Math.sin(time * 22);

      } else if (z.shape === 'cone') {

      } else if (z.shape === 'line') {

    }

  }
};

/* ---------------- Campos (gravidade, singularidade, anomalias) ---------------- */
const Fields = {
  list: [],
  clear() { this.list.length = 0; },
  add(o) { const f = Object.assign({ kind: 'grav', x: 0, y: 0, r: 60, t: 3, pull: 140, massMax: 3, arm: 0, age: 0, dps: 0, hurtPlayer: false, col: '#b080ff', sign: 1 }, o); f.max = f.t; this.list.push(f); if (this.list.length > 12) this.list.shift(); return f; },
  radius(f) { return f.kind === 'sing' ? f.r * (0.35 + 0.65 * U.clamp((f.age - f.arm) / (f.max - f.arm), 0, 1)) : f.r; },
  update(dt) {

      const f = this.list[i]; f.age += dt; if (f.kind !== 'anomaly') f.t -= dt;
      if (f.kind === 'anomaly') { f.flip = (f.flip || 0) + dt; if (f.flip > f.period) { f.flip = 0; f.sign = -f.sign; Fx.ring(f.x, f.y, f.r, f.sign > 0 ? '#80a0ff' : '#ff80a0', 0.5); } }

      if (!active) { if (Math.random() < dt * 14) Fx.add(f.x + U.rand(-8, 8), f.y + U.rand(-8, 8), 0, 0, 0.3, 2, '#e0c0ff', { drag: 0, glow: 1 }); continue; }

        if (dps > 0 && f.kind !== 'anomaly') { e.fT = (e.fT || 0) - dt; if (e.fT <= 0) { e.fT = 0.25; damageEnemy(e, dps * 0.25, 'energy', { src: 'field' }); } }
      });

/* =====================================================================
 * MÓDULO 07 — PROGRESSÃO: XP, níveis, patentes, desbloqueios, loja,
 * melhorias, laboratório, conquistas e aplicação dos resultados da missão
 * ===================================================================== */
const Progress = {
  xpToNext(lvl) { const X = CFG.xp; return Math.round(X.base + lvl * X.perLevel + lvl * lvl * X.perLevelSq); },
  rankFor(lvl) { let r = RANKS[0]; for (const x of RANKS) if (lvl >= x.lvl) r = x; return r; },
  prof() { return Game.profile; },
  techMul(key, def) { let v = def; const p = Game.profile; if (!p) return v; for (const id in p.techs) { const t = TECHS[id]; if (t && p.techs[id] && t.apply[key] !== undefined) v *= t.apply[key]; } return v; },
  techAdd(key) { let v = 0; const p = Game.profile; if (!p) return v; for (const id in p.techs) { const t = TECHS[id]; if (t && p.techs[id] && t.apply[key] !== undefined) v += t.apply[key]; } return v; },
  isUnlocked(item) { const p = Game.profile; return p.level >= item.unlock || !!(item.ach && p.achievements[item.ach]); },
  levelProgress() { const p = Game.profile; return p.level >= CFG.xp.maxLevel ? 1 : p.xp / this.xpToNext(p.level); },
  addXp(n) {
    const p = Game.profile, ups = []; n = Math.max(0, Math.round(n)); p.xp += n; p.totalXp += n;
    while (p.level < CFG.xp.maxLevel && p.xp >= this.xpToNext(p.level)) { p.xp -= this.xpToNext(p.level); p.level++; ups.push(p.level); }
    if (p.level >= CFG.xp.maxLevel) p.xp = 0; return ups;
  },
  unlocksAt(lvl) {
    const out = [];
    for (const id in WEAPONS) if (WEAPONS[id].unlock === lvl) out.push({ kind: 'Arma', name: WEAPONS[id].name });
    for (const id in SUPPORTS) if (SUPPORTS[id].unlock === lvl && lvl > 1) out.push({ kind: 'Suporte', name: SUPPORTS[id].name });
    for (const id in TECHS) if (TECHS[id].unlock === lvl) out.push({ kind: 'Tecnologia', name: TECHS[id].name });
    for (const s of SKINS) if (s.unlock === lvl && lvl > 1) out.push({ kind: 'Skin', name: s.name });
    for (const k in COSMETICS) for (const c of COSMETICS[k]) if (c.unlock === lvl && lvl > 1 && !c.ach) out.push({ kind: { helmet: 'Capacete', armor: 'Armadura', backpack: 'Mochila', emblem: 'Emblema', color: 'Cor' }[k], name: c.name });
    for (const r of RANKS) if (r.lvl === lvl && lvl > 1) out.push({ kind: 'Patente', name: r.name });
    return out;
  },
  save() { SaveSys.save(); },

  /* ----- loja ----- */
  canAfford(price, mats) { const p = Game.profile; return p.credits >= price && p.materials >= (mats || 0); },

  /* ---------- fim de missão ---------- */

    }

  /* marcadores para minimapa / setas do HUD */

/* =====================================================================
 * MÓDULO 08b — MODIFICADORES ALEATÓRIOS DE MISSÃO (12, definidos em MODIFIERS)

  /* ---- sorteio ---- */
  roll(planetId, diffId) {

    const last = (P && P.mods && P.mods.last) || [], all = MODIFIERS.filter(m => m.planets.includes(planetId) && m.minDiff <= diffId);
    const pool = (list) => { const fresh = list.filter(m => !last.includes(m.id)); return fresh.length ? fresh : list; };

  },
  spawnPredator(m) {

  },

  update(dt) {

      Zones.add({ shape: 'circle', x, y, r: 24, warn: 1.3, dmg: 13 * Mis.diffDef.dmg, col: '#c0a070', knock: 70, shake: 5, snd: 'tremor', fissure: true, onFire: (z) => { World.scorch(z.x, z.y, 6); for (let i = 0; i < 6; i++) Fx.add(z.x + U.rand(-8, 8), z.y + U.rand(-8, 8), U.rand(-30, 30), U.rand(-50, -10), 0.5, 2, '#7a5a40', { drag: 2 }); } });
      Cam.kick(2); Snd.play('tremor', 0.5); if (!this.state.quakeMsg) { this.state.quakeMsg = true; Mis.warn('TREMORES — FISSURAS ABRINDO PERTO DE VOCÊ'); } return; }
  },

    if (this.heat >= 100) { this.overheat = 4.5; Mis.notify('SUPERAQUECIMENTO — CORRIDA BLOQUEADA', '#ff7a30'); Mis.warn('SUPERAQUECIMENTO!'); Snd.play('steam', 0.9); }
  },
  onShot() { if (this.has('heat') && this.overheat <= 0) this.heat = Math.min(100, this.heat + 3.2); },

/* Ranking local (perfis deste navegador). O ranking GLOBAL fica em 12_online.js
 * (Supabase; pontuações validadas e recalculadas no servidor — o cliente nunca é confiável). */
const Ranking = {
  cats: { xp: 'XP / Nível', kills: 'Eliminações', missions: 'Missões', streak: 'Sobrevivência', speed: 'Velocidade', weekly: 'Semanal' },
  value(cat, p, mis) {
    switch (cat) {
      case 'xp': return p.totalXp; case 'kills': return p.stats.kills; case 'missions': return p.stats.missions; case 'streak': return p.stats.bestStreak;
      case 'weekly': return p.records.weekly.week === U.isoWeek() ? p.records.weekly.score : 0;
      case 'speed': { let best = null; for (const k in p.records.bestTimes) if (k.split(':')[1] === mis) best = best === null ? p.records.bestTimes[k] : Math.min(best, p.records.bestTimes[k]); return best; }
    } return 0;
  },
  fmt(cat, v, p) { if (v === null || v === undefined) return '—'; if (cat === 'speed') return U.fmtTime(v); if (cat === 'xp' && p) return 'NV ' + p.level + ' · ' + U.fmtNum(v) + ' XP'; return U.fmtNum(v); },
  rows(cat, mis) {
    const out = [];
    for (let i = 1; i <= SaveSys.slots; i++) { const p = i === Game.slot ? Game.profile : SaveSys.load(i); if (p) out.push({ name: p.name, v: this.value(cat, p, mis), p, me: i === Game.slot }); }
    const k = { xp: 140000, kills: 5200, missions: 150, streak: 15, weekly: 22000 };
    for (const r of RANK_REFS) { let v = cat === 'speed' ? Math.round(150 + (1 - r.f) * 260) : Math.round(k[cat] * r.f); out.push({ name: r.name, v, ref: true, p: cat === 'xp' ? { level: Math.min(30, Math.max(1, Math.round(r.f * 30))) } : null }); }
    const asc = cat === 'speed'; out.sort((a, b) => (a.v === null) - (b.v === null) || (asc ? a.v - b.v : b.v - a.v)); return out;
  }
};
