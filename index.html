<!--
=====================================================================
  OPERATION: LAST FRONTIER — MVP 0.2  (arquivo único, sem dependências)
=====================================================================
  COMO JOGAR: abra este arquivo em um navegador moderno (Chrome, Edge, Firefox).
  Funciona offline. O progresso é salvo automaticamente no LocalStorage.

  COMO ATUALIZAR (guia para futuras versões)
  - O script abaixo é dividido em MÓDULOS numerados (procure por "MÓDULO NN"):
      00 Dados/Config  · 01 Core (entrada, save, áudio) · 02 Sprites · 03 Mundo
      04 Combate · 05 Jogador · 06 Inimigos/IA · 07 Progressão · 08 Missões
      09 Render/HUD · 10-11 Interface · 12 Loop principal
  - Novo conteúdo = nova entrada nas tabelas do MÓDULO 00 (WEAPONS, SUPPORTS,
    ENEMIES, VARIANTS, PLANETS, MISSIONS, SKINS, COSMETICS, TECHS, ACHIEVEMENTS).
    Os menus (arsenal, hangar, laboratório...) se atualizam sozinhos.
  - Balanceamento: CFG, DIFFICULTIES e os números de cada tabela (MÓDULO 00).
  - Visão/IA dos inimigos: CFG.vision (alcance, áudio, memória) e sight/fov em ENEMIES (MÓDULO 00); lógica em MÓDULO 06 ("Percepção").
  - Save: mude SAVE_VERSION e adicione a migração em SaveSys.migrate (MÓDULO 01).
  - Multiplayer: lógica de combate (04-08) é separada da interface (09-11).
  - Ranking online: crie um provider no objeto Ranking (MÓDULO 11).
  - Versão/notas: VERSION e CHANGELOG (MÓDULO 00).
=====================================================================
-->

<div id="app">

<noscript>Este jogo precisa de JavaScript habilitado.</noscript>
<script>
(function(){'use strict';
/* =====================================================================
 * MÓDULO 00 — DADOS E CONFIGURAÇÃO (CFG / DATA)
 * Todo o balanceamento do jogo vive aqui. Para adicionar conteúdo novo
 * (arma, inimigo, suporte, planeta, missão, skin...) basta registrar uma
 * nova entrada nas tabelas abaixo — os menus se atualizam sozinhos.
 * ===================================================================== */
const VERSION = '0.2.1';
const SAVE_VERSION = 1;          // aumente ao mudar o formato do save e adicione uma migração em SaveSys.migrate
const BUILD_DATE = '2026-11-01';

const CHANGELOG = [
  { v: '0.2.1', date: BUILD_DATE, notes: [
    'Inimigos não rastreiam mais o jogador: hordas vão a pontos de patrulha aleatórios (ou à zona de extração) e só te perseguem se te virem ou ouvirem.',
    'Audição mais curta e imprecisa (investigam o ponto aproximado do tiro, com intervalo entre reações).',
    'Campo de visão dos inimigos ~30% menor (alcance e ângulo).',
    'Menos inimigos nas dificuldades iniciais: população inicial, ritmo de spawn e limite de vivos reduzidos (Recruta/Soldado/Veterano).' ] },
  { v: '0.2.0', date: BUILD_DATE, notes: [
    'Importar save: botão na tela de perfis e em Configurações > Dados (arquivo exportado .json, com validação).',
    'Visão dos inimigos: só enxergam o jogador dentro do cone de visão e com linha de visão livre — paredes e pedras bloqueiam.',
    'Perderam o contato? Vão até a última posição vista, procuram e desistem. Sons de tiro/explosão e dano atraem para o ponto do som.',
    'Balões "!" (viu) e "?" (ouviu/procurando) sobre os inimigos; opção "Mostrar campo de visão dos inimigos" em Configurações.',
    'Correções: inimigos presos em props/quinas, spawn excessivo durante a extração, equilíbrio da Defesa, respawn perto da nave.' ] },
  { v: '0.1.0', date: BUILD_DATE, notes: [
    'MVP inicial: combate top-down, 5 tipos de missão, extração, 2 planetas.',
    '6 armas primárias, 3 secundárias, 3 especiais, 4 suportes.',
    '5 dificuldades, 30 níveis, patentes, desbloqueios, créditos e materiais.',
    'Base militar: Arsenal, Quartel, Personalização, Terminal, Laboratório, Rankings, Hangar.',
    'Salvamento automático em 3 perfis, ranking local, áudio procedural.' ] }
];

/* ---------------- Configuração geral ---------------- */
const CFG = {
  tile: 16,
  mapW: 96, mapH: 96,
  step: 1 / 60,                       // passo fixo da lógica
  view: { h: 270, minW: 320, maxW: 720 },
  player: {
    hp: 100, speed: 84, runMul: 1.55, resist: 1.0, reinforcements: 3, radius: 5,
    stamina: 100, drain: 32, regen: 22, regenDelay: 0.9, carrySlow: 0.84,
    respawnTime: 4.0, respawnAmmo: 0.5
  },
  camera: { lookahead: 0.10, smooth: 10 },
  xp: { base: 100, perLevel: 75, perLevelSq: 12, mult: 1, maxLevel: 30 },
  reward: { xpObjective: 250, xpSecondary: 150, xpMission: 300, xpExtract: 200, xpFailKillMult: 1, failRewardMult: 0.25 },
  extraction: { call: 30, board: 2.5, wait: 30, radius: 46, hold: 1.1, spawnMult: 1.5 },
  drops: { ammo: 0.10, health: 0.06, specialBonus: 0.6, healthAmount: 28, ammoFrac: 0.5 },
  // Percepção dos inimigos: só enxergam o jogador dentro do cone de visão (fov, em graus), do alcance (sight, em px) e com linha de
  // visão livre (paredes e pedras bloqueiam). Cada inimigo tem sight/fov na tabela ENEMIES. Ajuste tudo por aqui.
  vision: { interval: 0.14,      // segundos entre verificações de visão por inimigo
            near: 20,            // raio em que percebem o jogador em 360° (ainda exige linha de visão livre)
            dark: 0.75,          // multiplicador de alcance em planetas escuros (Nox)
            engaged: 1.15,       // multiplicador de alcance enquanto já estão vendo o jogador (perdem o contato mais tarde)
            alertAllies: 70,     // raio em que o grito de um inimigo alerta aliados
            searchTime: [3.5, 6],// tempo procurando na última posição conhecida antes de desistir
            hear: { normal: 110, loud: 160, error: 55, cooldown: 2.5 }, // audição: raio dos tiros do jogador (0 desliga), erro de posição (px) e intervalo mínimo entre reações — investigam o PONTO aproximado do som
            hitReact: true },    // ao serem atingidos fora do campo de visão, investigam de onde veio o tiro
  director: { baseInterval: 2.6, minSpawnDist: 200, maxSpawnDist: 480, burst: 3 },
  fx: { maxParticles: 700, maxProjectiles: 500, maxTexts: 60 },
  keys: {
    up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
    run: ['ShiftLeft', 'ShiftRight'], reload: ['KeyR'], interact: ['KeyE'], swap: ['KeyQ'],
    equip: ['KeyF'], support: ['KeyG'], pause: ['Escape', 'KeyP']
  }
};

/* ---------------- Armas ---------------- */
/* rate = tiros/s ; spread em graus ; recoil em graus por tiro ; reserveMags = pentes extras */
const WEAPONS = {
  ar01:  { id:'ar01', name:'Rifle de Assalto AR-01', short:'AR-01', slot:'primary', cls:'rifle', unlock:1, price:0, mats:0, tier:1,
           dmg:20, pellets:1, rate:9, mag:30, reserveMags:4, reload:1.8, spread:2.2, recoil:0.9, speed:520, life:0.85, type:'bullet', auto:true, pierce:0, snd:'ar',

/* =====================================================================
 * MÓDULO 01 — CORE: utilitários, entrada, configurações, salvamento, áudio
 * ===================================================================== */
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}

const U = {
  rand: (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a)),
  randi: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  dist2: (x1, y1, x2, y2) => (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1),
  angDiff: (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; },
  fmtTime: (s) => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); },
  fmtNum: (n) => Math.round(n).toLocaleString('pt-BR'),
  mulberry32: (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; },
  hash2: (x, y) => { let n = (x * 374761393 + y * 668265263) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; },
  weighted: (entries) => { let tot = 0; for (const e of entries) tot += e[1]; let r = Math.random() * tot; for (const e of entries) { r -= e[1]; if (r <= 0) return e[0]; } return entries[entries.length - 1][0]; },
  isoWeek: (d = new Date()) => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return t.getUTCFullYear() + '-W' + String(Math.ceil(((t - y0) / 864e5 + 1) / 7)).padStart(2, '0'); },
  deep: (o) => JSON.parse(JSON.stringify(o)),
  merge: (def, obj) => { // preenche chaves ausentes (compatibilidade com saves antigos)
    if (obj == null || typeof obj !== 'object' || Array.isArray(def)) return obj === undefined ? U.deep(def) : obj;

/* ---------------- Entrada ---------------- */
const Input = {
  keys: new Set(), pressed: new Set(), mouse: { sx: 0, sy: 0, down: false, pressed: false, right: false }, wheel: 0, enabled: true, _byCode: {},
  init() {
    for (const act in CFG.keys) for (const c of CFG.keys[act]) (this._byCode[c] = this._byCode[c] || []).push(act);
    addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (Game && Game.state === 'mission' && ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
      if (!e.repeat) { this.pressed.add(e.code); for (const a of (this._byCode[e.code] || [])) this.pressed.add('@' + a); }
      this.keys.add(e.code);
    });
    addEventListener('keyup', (e) => this.keys.delete(e.code));
    addEventListener('blur', () => { this.keys.clear(); this.mouse.down = false; if (Game && Game.state === 'mission') Game.pause(true); });
    const cv = $('hud');
    const upd = (e) => { const r = cv.getBoundingClientRect(); this.mouse.sx = e.clientX - r.left; this.mouse.sy = e.clientY - r.top; };
    addEventListener('mousemove', upd);
    addEventListener('mousedown', (e) => { upd(e); if (Game.state !== 'mission' || Game.paused) return; if (e.button === 0) { this.mouse.down = true; this.mouse.pressed = true; } if (e.button === 2) this.mouse.right = true; });
    addEventListener('mouseup', (e) => { if (e.button === 0) this.mouse.down = false; if (e.button === 2) this.mouse.right = false; });
    addEventListener('wheel', (e) => { if (Game.state === 'mission') this.wheel += Math.sign(e.deltaY); }, { passive: true });
    addEventListener('contextmenu', (e) => { if (Game.state === 'mission') e.preventDefault(); });
  },
  down(act) { for (const c of CFG.keys[act]) if (this.keys.has(c)) return true; return false; },
  hit(act) { return this.pressed.has('@' + act); },
  endStep() { this.pressed.clear(); this.mouse.pressed = false; this.wheel = 0; },
  virtual: null   // usado pelo piloto automático de testes: { mx,my,fire,... }
};

      out.push({ slot: i, exists: !!p, name: p && p.name, level: p && p.level, last: p && p.lastPlayed, missions: p && p.stats && p.stats.missions });

  erase(slot) { this._del(this.key(slot)); },

  /* ---------- Importação de save ----------

   * do perfil padrão e só recebe campos conhecidos, com números limitados e IDs que existam nas tabelas do jogo.
   * Ao adicionar campos novos ao save, inclua-os aqui também (e a migração em migrate). */
  sanitize(raw) {

    if (raw.v !== undefined && (typeof raw.v !== 'number' || raw.v > SAVE_VERSION)) throw new Error('Este save é de uma versão mais nova do jogo (v' + raw.v + '). Atualize o jogo para importá-lo.');
    const d = this.migrate(raw); // aplica migrações de versões antigas (quando existirem)
    const num = (v, lo, hi, def) => (typeof v === 'number' && isFinite(v)) ? Math.min(hi, Math.max(lo, v)) : def, int = (v, lo, hi, def) => Math.round(num(v, lo, hi, def));
    const own = (o, k) => !!o && typeof o === 'object' && Object.prototype.hasOwnProperty.call(o, k), keyOk = /^[A-Za-z0-9_:.\-]{1,48}$/, hex = /^#[0-9a-fA-F]{6}$/;

    p.level = int(d.level, 1, CFG.xp.maxLevel, 1); p.xp = int(d.xp, 0, 1e9, 0); p.totalXp = int(d.totalXp, 0, 1e12, 0); p.credits = int(d.credits, 0, 1e9, 300); p.materials = int(d.materials, 0, 1e7, 0);
    for (const id in WEAPONS) if (own(d.owned, id) && d.owned[id] === true) p.owned[id] = true;
    for (const id in SUPPORTS) if (own(d.ownedSupports, id) && d.ownedSupports[id] === true) p.ownedSupports[id] = true;
    for (const id in WEAPONS) if (own(d.upgrades, id) && d.upgrades[id] && typeof d.upgrades[id] === 'object') { const u = {}; for (const c in UPGRADES) if (c !== 'costBase' && own(d.upgrades[id], c)) u[c] = int(d.upgrades[id][c], 0, 3, 0); p.upgrades[id] = u; }
    for (const id in TECHS) if (own(d.techs, id) && d.techs[id] === true) p.techs[id] = true;
    for (const a of ACHIEVEMENTS) if (own(d.achievements, a.id) && d.achievements[a.id]) p.achievements[a.id] = true;
    const L = d.look && typeof d.look === 'object' ? d.look : {}, okId = (list, v, def) => (typeof v === 'string' && list.some(x => x.id === v)) ? v : def;

      primary: hex.test(L.primary) ? L.primary : p.look.primary, secondary: hex.test(L.secondary) ? L.secondary : p.look.secondary, camo: L.camo === 'dots' ? 'dots' : 'none' };

    p.loadout = { primary: pick('primary', 'ar01'), secondary: pick('secondary', 'p01'), special: pick('special', null), supports: (Array.isArray(LD.supports) ? LD.supports : []).filter((s, i, a) => typeof s === 'string' && p.ownedSupports[s] && a.indexOf(s) === i).slice(0, 2) };

    p.records = { bestTimes: mapNum(R.bestTimes), bestScores: mapNum(R.bestScores), completed: mapNum(R.completed), weekly: { week: (R.weekly && /^\d{4}-W\d{2}$/.test(R.weekly.week)) ? R.weekly.week : U.isoWeek(), score: num(R.weekly && R.weekly.score, 0, 1e9, 0) } };
    p.v = SAVE_VERSION; return p;
  },
  /* lê o texto do arquivo e devolve o perfil validado (lança Error com mensagem em português se for inválido) */
  parseImport(text) {
    if (typeof text !== 'string' || !text.trim()) throw new Error('O arquivo está vazio.');
    let raw; try { raw = JSON.parse(text); } catch (e) { throw new Error('O arquivo não é um JSON válido.'); }
    return this.sanitize(raw);

  importTo(slot, profile) { if (!(slot >= 1 && slot <= this.slots)) throw new Error('Slot inválido.'); profile.lastPlayed = Date.now(); this._set(this.key(slot), JSON.stringify(profile)); return profile; },
  allProfiles() { const o = []; for (let i = 1; i <= this.slots; i++) { const p = this.load(i); if (p) o.push(p); } return o; }

const Snd = {
  ctx: null, master: null, gm: null, gs: null, gu: null, nbuf: null, last: {}, voices: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }

      const len = c.sampleRate * 1.5, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    } catch (e) { this.ctx = null; }
  },
  setVolumes() {
    if (!this.ctx) return; const v = Settings.data.vol, t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(v.master, t, 0.02); this.gm.gain.setTargetAtTime(v.music * 0.55, t, 0.02);
    this.gs.gain.setTargetAtTime(v.sfx, t, 0.02); this.gu.gain.setTargetAtTime(v.ui, t, 0.02);
  },
  tone(o) { // {type,f0,f1,dur,vol,att,dest,delay}

    const t = c.currentTime + (o.delay || 0), osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'square'; osc.frequency.setValueAtTime(o.f0, t);

    const att = o.att || 0.004; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(o.vol, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    osc.connect(g); g.connect(o.dest || this.gs); osc.start(t); osc.stop(t + o.dur + 0.02); this.voices++; osc.onended = () => { this.voices--; };
  },
  noise(o) { // {dur,vol,ft,f0,f1,q,dest,delay,att}

    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + o.dur); f.Q.value = o.q || 0.7;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(o.vol, t + (o.att || 0.003)); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);

  },
  play(name, vol = 1) {
    const c = this.ctx; if (!c) return; const now = c.currentTime;
    const gap = SFX_GAP[name] === undefined ? 0.025 : SFX_GAP[name];
    if (this.last[name] && now - this.last[name] < gap) return; this.last[name] = now;

  stop() { this.cur = null; },

  hitEnemies(p, x0, y0, x1, y1) {

  else if (pr.kind === 'crate') { Fx.spark(pr.x, pr.y, 0, 10, '#c0a060', 100); Snd.play('hit'); dropLoot(pr.x, pr.y, 0.7); }
  else if (pr.kind === 'nest') { explode(pr.x, pr.y, 36, 60, { owner: 'p', self: 0, nest: true }); Fx.blood(pr.x, pr.y, 0, 30, '#b070d0'); World.decal(pr.x, pr.y, '#6a3a80', 26, 60); Mis && Mis.onNestDestroyed(pr); }

      const gx = p.x - Math.cos(p.ang) * 14 + Math.cos(d.bob * 0.6) * 10, gy = p.y - Math.sin(p.ang) * 14 + Math.sin(d.bob * 0.6) * 10 - 6; d.x += (gx - d.x) * Math.min(1, dt * 5); d.y += (gy - d.y) * Math.min(1, dt * 5);

}

let _ax = 0, _ay = 0;
function avoidProps(e, dx, dy, side) { // desvia de props sólidos: troca a componente que aponta para dentro por um deslize tangencial (resultado em _ax/_ay)
  for (const pr of Ent.props) {
    if (!pr.solid || pr.dead) continue; const px = e.x - pr.x, py = e.y - pr.y, min = pr.cr + e.r + 6; if (Math.abs(px) > min || Math.abs(py) > min) continue;
    const pd = Math.hypot(px, py) || 0.01; if (pd > min) continue; const nx = px / pd, ny = py / pd, into = -(dx * nx + dy * ny);
    if (into > 0) { dx += nx * into - ny * side * into * 0.9; dy += ny * into + nx * side * into * 0.9; }
  }

}

}

function updatePlayer(dt) {
  const p = Ent.player, PC = CFG.player, V = Input.virtual;
  if (p.hurtT > 0) p.hurtT -= dt; if (p.inv > 0) p.inv -= dt; if (p.swapT > 0) p.swapT -= dt; if (p.slowT > 0) p.slowT -= dt; if (p.fireBuf > 0) p.fireBuf -= dt;
  const w = p.weapons[p.wi];
  for (const ww of p.weapons) { if (ww.cd > 0) ww.cd -= dt; ww.recoil = Math.max(0, ww.recoil - 9 * dt); }
  if (!p.alive) return;

  let mx = 0, my = 0;
  if (V) { mx = V.mx || 0; my = V.my || 0; } else { if (Input.down('left')) mx--; if (Input.down('right')) mx++; if (Input.down('up')) my--; if (Input.down('down')) my++; }

      else { const take = Math.min(w.magMax - w.mag, w.reserve); w.mag += take; w.reserve -= take; w.reloading = false; Snd.play('reload2'); }

function updatePickups(dt) {

    const k = Ent.pickups[i]; k.life -= dt; k.bob += dt * 4; if (k.life <= 0) { Ent.pickups.splice(i, 1); continue; }
    if (!p.alive) continue; const d = U.dist(p.x, p.y, k.x, k.y);

    if (d < 9) {

        else { moveEnemy(e, tg.x, tg.y, 1, dt, tg.kind === 'inst' ? 'inst' : 'player'); if (e.los) faceTo(e, tg.x, tg.y, dt, 8); else if (sp > 4) e.ang += U.angDiff(e.ang, Math.atan2(e.vy, e.vx)) * Math.min(1, dt * 10); }
      } else { // distância
        if (e.los && dist < def.pref * 0.75) { e.state = 'reposition'; e.stT = 0.9; break; }
        if (e.los && dist <= def.reach) {
          faceTo(e, tg.x, tg.y, dt); e.strafeT -= dt; if (e.strafeT <= 0) { e.strafe = -e.strafe; e.strafeT = U.rand(1, 2.5); }
          const sa = Math.atan2(tg.y - e.y, tg.x - e.x) + Math.PI / 2 * e.strafe; World.move(e, Math.cos(sa) * e.spd * 0.45 * dt, Math.sin(sa) * e.spd * 0.45 * dt, e.r);
          if (e.atkCd <= 0) { e.state = 'attack'; e.stT = WINDUP.spitter; }
        } else { moveEnemy(e, tg.x, tg.y, 1, dt, tg.kind === 'inst' ? 'inst' : 'player'); if (sp > 4) e.ang += U.angDiff(e.ang, Math.atan2(e.vy, e.vx)) * Math.min(1, dt * 10); }

      if (!e.struck && p.alive && U.dist(e.x, e.y, p.x, p.y) < e.r + p.r + 3) { e.struck = true; hurtPlayer(def.charge * Mis.diffDef.dmg, e.ang); p.vx += e.tx * 160; p.vy += e.ty * 160; }

  if (e.state === 'chase' && !def.melee) { /* cuspidores mantêm distância */ }
}

function updateEnemies(dt) {
  Grid.rebuild(); const p = Ent.player;
  Flows.t -= dt; if (Flows.t <= 0) { Flows.t = 0.25; if (p.alive) { const tx = (p.x / T) | 0, ty = (p.y / T) | 0; if (tx !== Flows.ptx || ty !== Flows.pty) { Flows.player.compute(tx, ty, World.solid); Flows.ptx = tx; Flows.pty = ty; } } }
  if (Mis.guardAura !== false) { Mis.auraT = (Mis.auraT || 0) - dt; if (Mis.auraT <= 0) { Mis.auraT = 0.3; for (const e of Ent.enemies) e.aura = false; for (const g of Ent.enemies) if (g.type === 'guardian' && g.state !== 'dying') Grid.query(g.x, g.y, 72, (o) => { if (o !== g) o.aura = true; }); } }
  let alive = 0;

  for (let i = Ent.enemies.length - 1; i >= 0; i--) if (Ent.enemies[i].dead) Ent.enemies.splice(i, 1);

/* ---------------- Diretor de spawn (hordas) ---------------- */
const Director = {
  timer: 3, reset() { this.timer = 3; },
  pickType(T) {
    const W = World.planet.weights, diff = Mis.diffDef, ent = [];
    ent.push(['crawler', Math.max(14, W.crawler * (1.25 - 0.12 * T))]); ent.push(['warrior', W.warrior]); ent.push(['spitter', W.spitter * (T > 1.4 ? 1 : 0.5)]);
    if (T >= 2.0) ent.push(['brute', W.brute * (T - 1.3) * diff.special * 0.7]);
    if (T >= 3.4) ent.push(['guardian', W.guardian * (T - 2.8) * diff.special * 0.7]);
    return U.weighted(ent);
  },
  findPos() {
    const p = Ent.player, D = CFG.director, minD = World.planet.dark ? 150 : D.minSpawnDist, maxD = D.maxSpawnDist;
    for (let k = 0; k < 30; k++) {
      const i = World.spots[(Math.random() * World.spots.length) | 0], x = ((i % World.w) + 0.5) * T, y = (((i / World.w) | 0) + 0.5) * T, d = U.dist(x, y, p.x, p.y);
      if (d < minD || d > maxD) continue; if (x > Cam.x - 30 && x < Cam.x + Cam.w + 30 && y > Cam.y - 30 && y < Cam.y + Cam.h + 30) continue; if (Flows.player.d[i] > 500) continue; return { x, y };
    }
    return null;
  },
  roamPoint() { // ponto de patrulha aleatório perto da região do jogador (mas sem mirar na posição dele)
    const p = Ent.player;
    for (let k = 0; k < 30; k++) { const i = World.spots[(Math.random() * World.spots.length) | 0], x = ((i % World.w) + 0.5) * T, y = (((i / World.w) | 0) + 0.5) * T, d = U.dist(x, y, p.x, p.y); if (d >= 140 && d <= 480) return { x, y }; }
    return null;
  },
  group(n, T, opt = {}) {
    const pos = opt.pos || this.findPos(); if (!pos) return 0; let made = 0; const roam = (!opt.state || opt.state === 'chase') ? this.roamPoint() : null;
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, d = U.rand(0, 16), x = pos.x + Math.cos(a) * d, y = pos.y + Math.sin(a) * d; if (World.solidAt(x, y) || World.boxHit(x, y, 6)) continue; spawnEnemy(opt.type || this.pickType(T), x, y, { state: opt.state || 'chase', nest: opt.nest, roam }); made++; }
    return made;
  },
  update(dt) {
    if (!Mis.spawnOn || !Ent.player.alive) return;
    const diff = Mis.diffDef, rate = diff.rate * Mis.spawnMul; this.timer -= dt * rate;
    if (this.timer > 0 || Ent.alive >= diff.cap * (Mis.phase === 'extract' ? 1.15 : 1)) return;
    const thr = diff.id + Mis.time / 200 + (Mis.phase === 'extract' ? 1 : 0), n = 1 + Math.floor(Math.random() * CFG.director.burst * (Mis.phase === 'extract' ? 1.4 : 1) * (0.7 + diff.count * 0.3));
    this.group(diff.id <= 2 ? Math.min(n, 2) : n, thr); this.timer = CFG.director.baseInterval * U.rand(0.8, 1.2);
  },
  packs(count, avoidPts) { // grupos em patrulha pelo mapa
    const thr = Mis.diffDef.id; let made = 0, tries = 0; const rooms = World.rooms.filter(r => r.kind !== 'pad');
    while (made < count && tries++ < 200) {

      const n = U.randi(2, Mis.diffDef.id <= 2 ? 3 : 4) + (Mis.diffDef.id > 2 ? 1 : 0); this.group(n, thr, { pos: c, state: 'patrol' }); made++;

/* =====================================================================
 * MÓDULO 07 — PROGRESSÃO: XP, níveis, patentes, desbloqueios, loja,
 * melhorias, laboratório, conquistas e aplicação dos resultados da missão
 * ===================================================================== */
const Progress = {
  xpToNext(lvl) { const X = CFG.xp; return Math.round(X.base + lvl * X.perLevel + lvl * lvl * X.perLevelSq); },
  rankFor(lvl) { let r = RANKS[0]; for (const x of RANKS) if (lvl >= x.lvl) r = x; return r; },
  prof() { return Game.profile; },
  techMul(key, def) { let v = def; const p = Game.profile; if (!p) return v; for (const id in p.techs) { const t = TECHS[id]; if (t && p.techs[id] && t.apply[key] !== undefined) v *= t.apply[key]; } return v; },
  techAdd(key) { let v = 0; const p = Game.profile; if (!p) return v; for (const id in p.techs) { const t = TECHS[id]; if (t && p.techs[id] && t.apply[key] !== undefined) v += t.apply[key]; } return v; },
  isUnlocked(item) { const p = Game.profile; return p.level >= item.unlock || !!(item.ach && p.achievements[item.ach]); },
  levelProgress() { const p = Game.profile; return p.level >= CFG.xp.maxLevel ? 1 : p.xp / this.xpToNext(p.level); },
  addXp(n) {
    const p = Game.profile, ups = []; n = Math.max(0, Math.round(n)); p.xp += n; p.totalXp += n;
    while (p.level < CFG.xp.maxLevel && p.xp >= this.xpToNext(p.level)) { p.xp -= this.xpToNext(p.level); p.level++; ups.push(p.level); }
    if (p.level >= CFG.xp.maxLevel) p.xp = 0; return ups;
  },
  unlocksAt(lvl) {
    const out = [];
    for (const id in WEAPONS) if (WEAPONS[id].unlock === lvl) out.push({ kind: 'Arma', name: WEAPONS[id].name });
    for (const id in SUPPORTS) if (SUPPORTS[id].unlock === lvl && lvl > 1) out.push({ kind: 'Suporte', name: SUPPORTS[id].name });
    for (const id in TECHS) if (TECHS[id].unlock === lvl) out.push({ kind: 'Tecnologia', name: TECHS[id].name });
    for (const s of SKINS) if (s.unlock === lvl && lvl > 1) out.push({ kind: 'Skin', name: s.name });
    for (const k in COSMETICS) for (const c of COSMETICS[k]) if (c.unlock === lvl && lvl > 1 && !c.ach) out.push({ kind: { helmet: 'Capacete', armor: 'Armadura', backpack: 'Mochila', emblem: 'Emblema', color: 'Cor' }[k], name: c.name });
    for (const r of RANKS) if (r.lvl === lvl && lvl > 1) out.push({ kind: 'Patente', name: r.name });
    return out;
  },
  save() { SaveSys.save(); },

  /* ----- loja ----- */
  canAfford(price, mats) { const p = Game.profile; return p.credits >= price && p.materials >= (mats || 0); },
  buy(price, mats) { const p = Game.profile; p.credits -= price; p.materials -= (mats || 0); },
  buyWeapon(id) {
    const p = Game.profile, d = WEAPONS[id]; if (p.owned[id]) return 'Já adquirida'; if (p.level < d.unlock) return 'Requer nível ' + d.unlock; if (!this.canAfford(d.price, d.mats)) return 'Recursos insuficientes';
    this.buy(d.price, d.mats); p.owned[id] = true; this.save(); return null;
  },
  upgradeCost(id, cat) { const p = Game.profile, lv = (p.upgrades[id] && p.upgrades[id][cat]) || 0; return lv >= 3 ? null : Math.round(UPGRADES.costBase[lv] * WEAPONS[id].tier); },
  buyUpgrade(id, cat) {
    const p = Game.profile; if (!p.owned[id]) return 'Adquira a arma primeiro'; const cost = this.upgradeCost(id, cat); if (cost === null) return 'Nível máximo'; if (p.credits < cost) return 'Créditos insuficientes';
    p.credits -= cost; p.upgrades[id] = p.upgrades[id] || { dmg: 0, acc: 0, ammo: 0 }; p.upgrades[id][cat]++; this.save(); return null;
  },
  buySupport(id) {
    const p = Game.profile, d = SUPPORTS[id]; if (p.ownedSupports[id]) return 'Já adquirido'; if (p.level < d.unlock) return 'Requer nível ' + d.unlock; if (!this.canAfford(d.price, d.mats)) return 'Recursos insuficientes';
    this.buy(d.price, d.mats); p.ownedSupports[id] = true; this.save(); return null;
  },
  buyTech(id) {
    const p = Game.profile, d = TECHS[id]; if (p.techs[id]) return 'Já desenvolvida'; if (p.level < d.unlock) return 'Requer nível ' + d.unlock; if (!this.canAfford(d.price, d.mats)) return 'Recursos insuficientes';
    this.buy(d.price, d.mats); p.techs[id] = true; this.save(); return null;
  },
  equipWeapon(id) { const p = Game.profile, d = WEAPONS[id]; if (!p.owned[id]) return false; p.loadout[d.slot] = (p.loadout[d.slot] === id && d.slot !== 'primary') ? null : id; this.save(); return true; },
  toggleSupport(id) {
    const p = Game.profile, s = p.loadout.supports; if (!p.ownedSupports[id]) return false; const i = s.indexOf(id);
    if (i >= 0) s.splice(i, 1); else { if (s.length >= 2) s.shift(); s.push(id); } this.save(); return true;
  },

  /* ----- resultado de missão ----- */
  score(m, success) {
    const diff = m.diffDef, secDone = m.secondaries.filter(s => s.done).length;
    let sc = (m.objDone ? 1000 : 0) + secDone * 500 + m.kills * 10 + m.specialKills * 50 + (success ? 1500 : 0) + Math.max(0, m.def.par - m.time) * 5 - m.stats.deaths * 300 - m.stats.reinfUsed * 150;
    return Math.max(0, Math.round(sc * diff.reward));
  },
  build(m) { // calcula recompensas (não aplica)
    const R = CFG.reward, diff = m.diffDef, success = m.success, secDone = m.secondaries.filter(s => s.done), pm = m.planet.rewardMult;
    let base = m.killXp + (m.objDone ? R.xpObjective : 0) + secDone.length * R.xpSecondary;
    if (success) base += R.xpMission + R.xpExtract; else if (!m.abandoned) base *= (m.objDone ? 0.5 : R.failRewardMult); else base = 0;

    return { success, reason: m.reason || '', planet: m.planet.id, planetName: m.planet.name, mission: m.def.id, missionName: m.def.name, diff: diff.id, diffName: diff.name, time: m.time,
      kills: m.kills, specialKills: m.specialKills, objDone: m.objDone, secondaries: m.secondaries.map(s => ({ text: s.text, done: s.done })), secDone: secDone.length, deaths: m.stats.deaths, reinfUsed: m.stats.reinfUsed,
      xp, credits: Math.round(cr), mats: Math.round(m.mats * (success ? 1 : 0.5)), score: this.score(m, success), shots: m.stats.shots, hits: m.stats.hits, damageTaken: Math.round(m.stats.damageTaken), nests: m.nestsKilled, abandoned: !!m.abandoned };
  },
  apply(r) { // aplica ao perfil, devolve dados para a tela de resultados
    const p = Game.profile, S = p.stats, before = { level: p.level, xp: p.xp, rank: this.rankFor(p.level).name };
    const ups = this.addXp(r.xp); p.credits += r.credits; p.materials += r.mats; S.creditsEarned += r.credits;
    S.kills += r.kills; S.specialKills += r.specialKills; S.deaths += r.deaths; S.shots += r.shots; S.hits += r.hits; S.damageTaken += r.damageTaken; S.nests += r.nests || 0; S.playTime += r.time; S.objectives += (r.objDone ? 1 : 0) + r.secDone;
    const key = r.planet + ':' + r.mission;
    if (r.abandoned) S.abandoned++;
    else if (r.success) {
      S.missions++; S.extractions++; p.records.completed[key] = (p.records.completed[key] || 0) + 1;
      if (r.deaths === 0) { S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak); } else S.streak = 0;
      if (!p.records.bestTimes[key + ':' + r.diff] || r.time < p.records.bestTimes[key + ':' + r.diff]) p.records.bestTimes[key + ':' + r.diff] = Math.round(r.time);
      if (!p.records.bestScores[key] || r.score > p.records.bestScores[key]) p.records.bestScores[key] = r.score;
      S.bestScore = Math.max(S.bestScore, r.score); p.diffUnlocked = Math.max(p.diffUnlocked, Math.min(5, r.diff + 1));
    } else { S.failed++; S.streak = 0; }
    const wk = U.isoWeek(); if (p.records.weekly.week !== wk) p.records.weekly = { week: wk, score: 0 }; if (r.success) p.records.weekly.score += r.score;
    // conquistas
    const newAch = []; for (const a of ACHIEVEMENTS) if (!p.achievements[a.id] && a.test(p, r.abandoned ? null : r)) { p.achievements[a.id] = true; newAch.push(a); }
    let achXp = 0; for (const a of newAch) achXp += a.xp; if (achXp) ups.push(...this.addXp(achXp));
    const unlocks = []; for (const l of ups) for (const u of this.unlocksAt(l)) unlocks.push({ level: l, ...u });
    p.lastPlanet = r.planet; p.lastMission = r.mission; p.lastDiff = r.diff;
    SaveSys.save();
    return { before, after: { level: p.level, xp: p.xp, rank: this.rankFor(p.level).name }, levelsGained: ups.filter((v, i) => ups.indexOf(v) === i), unlocks, newAch, achXp, totalXp: r.xp + achXp };
  }
};


/* =====================================================================

  }[kind];

}

    this.inst = null; this.secondaries = []; this.markers = []; this.auraT = 0; this.sampleCount = 0;
    World.generate(planetId, seed); Grid.init(); Flows.init(); Alerts.reset(); Ent.reset(); Director.reset();
    const p = Ent.player = createPlayer(World.spawn.x, World.spawn.y); p.drop = 2.6; p.dropMax = 2.6; Cam.snap(p.x, p.y);
    Flows.player.compute((p.x / T) | 0, (p.y / T) | 0, World.solid); Flows.ptx = (p.x / T) | 0; Flows.pty = (p.y / T) | 0;

  noise(x, y, r) { // som alto (tiro/explosão) em (x,y): inimigos dentro do raio investigam o ponto APROXIMADO do som (com erro e intervalo mínimo); não revela o jogador
    const H = CFG.vision.hear; if (!H || !(H.normal > 0)) return; const rr = r > 200 ? H.loud : H.normal, r2 = rr * rr;
    for (const e of Ent.enemies) if (!e.sees && Ent.time >= (e.hearT || 0) && (e.state === 'patrol' || e.state === 'search' || (e.state === 'chase' && e.hunt)) && U.dist2(e.x, e.y, x, y) < r2) { e.hearT = Ent.time + H.cooldown; hearEnemy(e, x, y, H.error); }
  }

    for (let i = 0; i < 14; i++) { const s = World.pickSpot({ avoid: avoid.concat(Ent.props.map(p => [p.x, p.y, 28])), tries: 60 }); if (s) makeProp('barrel', s.x, s.y); }
    for (let i = 0; i < 10; i++) { const s = World.pickSpot({ avoid: avoid.concat(Ent.props.map(p => [p.x, p.y, 24])), tries: 60 }); if (s) makeProp('crate', s.x, s.y); }

  /* ---------- inicialização por tipo ---------- */

  /* ---------- atualização por tipo ---------- */
  updateType(dt) {
    const p = Ent.player, d = this.diffDef;
    switch (this.type) {
      case 'elimination': { this.obj.cur = Math.min(this.kills, this.killTarget); this.obj.text = 'Eliminar criaturas hostis'; this.obj.max = this.killTarget; if (!this.objDone && this.kills >= this.killTarget) this.completeObjective(); break; }

  updateDefense(dt) {

        this.obj.text = 'Defender a instalação — onda ' + this.wave + '/3 (' + Math.max(0, this.waveTotal - this.waveSpawned + Ent.alive) + ' restantes)';

  /* ---------- extração ---------- */

  /* ---------- fim de missão ---------- */
  finish(success, reason) {

  abandon() { this.abandoned = true; this.finish(false, 'Missão abandonada'); this.endT = 0.1; }

  /* ---------- passo principal ---------- */
  step(dt) {
    const p = Ent.player; Ent.time += dt;
    for (const m of this.msgs) m.t -= dt; this.msgs = this.msgs.filter(m => m.t > 0); if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }

      if (p.drop < p.dropMax * 0.4 && !p.landed) { p.landed = true; Cam.kick(7); Fx.smoke(p.x, p.y, 10, 5); Fx.spark(p.x, p.y, 0, 14, '#ffc060', 80); Snd.play('slam', 0.6); }
    }
    if (this.phase !== 'insert') this.time += this.over ? 0 : dt;
    const canAct = p.drop <= 0 || p.drop < p.dropMax * 0.4;
    if (!this.over && p.drop <= 0) updatePlayer(dt); else { for (const w of p.weapons) { if (w.cd > 0) w.cd -= dt; } }
    if (this.phase !== 'insert') { Supports.update(dt); }
    if (!this.over && this.phase !== 'insert') { Director.update(dt); this.updateType(dt); this.updateExtraction(dt); }
    updateEnemies(dt); Proj.update(dt); updatePickups(dt); updateHazards(dt); Fx.update(dt);
    for (const pr of Ent.props) { if (pr.hitT > 0) pr.hitT -= dt; if (pr.kind === 'inst' && pr.hp <= 0 && !pr.dead) { pr.dead = true; destroyProp(pr); } }
    Ent.props = Ent.props.filter(pr => !(pr.dead && pr.kind !== 'inst' && pr.kind !== 'terminal' && pr.kind !== 'device' && pr.kind !== 'nest') || pr.keep);
    // morte / reforços
    if (!p.alive && !this.over) {
      p.deadT += dt;
      if (p.reinf > 0) { if (p.deadT >= CFG.player.respawnTime) this.respawn(); } else if (p.deadT >= 2) this.finish(false, 'Sem reforços restantes');
    }
    Music.intensity = Math.max(0.15, Music.intensity - dt * 0.04);
    if (this.over) { this.endT -= dt; }
    // câmera
    const look = CFG.camera.lookahead, gx = p.x + (Game.mouseWorld.x - p.x) * look, gy = p.y + (Game.mouseWorld.y - p.y) * look;
    Cam.update(dt, p.alive ? gx : p.x, p.alive ? gy : p.y);
    Input.endStep();
  }
  respawn() {
    const p = Ent.player; p.reinf--; this.stat('reinfUsed', 1); p.alive = true; p.hp = p.hpMax; let rs = World.spawn; if (this.ex.state === 'called' || this.ex.state === 'arrived') rs = World.pickSpot({ near: World.lz, maxD: 56, tries: 40 }) || World.lz; /* durante a extração o reforço cai perto da nave */ p.x = rs.x; p.y = rs.y; p.vx = p.vy = 0; p.stamina = CFG.player.stamina; p.drop = 1.6; p.dropMax = 1.6; p.landed = false; p.inv = 3.5; p.deadT = 0;
    for (const w of p.weapons) { w.reserve = Math.max(w.reserve, Math.round(w.reserveMax * CFG.player.respawnAmmo)); w.mag = w.magMax; w.reloading = false; }
    Cam.snap(p.x, p.y); this.msg('REFORÇO CHEGOU — RESTAM ' + p.reinf, '#60ff90', 3.5); Snd.play('ship', 0.6);
  }
  /* marcadores para minimapa / setas do HUD */
  getMarkers() {
    const m = [], lz = World.lz; m.push({ x: lz.x, y: lz.y, kind: 'lz', on: this.ex.state !== 'locked' });
    if (this.type === 'nests' && this.nests) for (const n of this.nests) if (!n.dead) m.push({ x: n.x, y: n.y, kind: 'nest', on: true });
    if (this.type === 'terminal' && this.term && !this.objDone) m.push({ x: this.term.x, y: this.term.y, kind: 'term', on: true });
    if (this.type === 'defense' && this.inst) m.push({ x: this.inst.x, y: this.inst.y, kind: 'inst', on: true });
    if (this.type === 'recovery' && this.dev && !this.dev.carried && !this.objDone) m.push({ x: this.dev.x, y: this.dev.y, kind: 'dev', on: true });
    return m;
  }
}

  cats: { xp: 'XP / Nível', kills: 'Eliminações', missions: 'Missões', streak: 'Sobrevivência', speed: 'Velocidade', weekly: 'Semanal' },
  value(cat, p, mis) {
    switch (cat) {
      case 'xp': return p.totalXp; case 'kills': return p.stats.kills; case 'missions': return p.stats.missions; case 'streak': return p.stats.bestStreak;
      case 'weekly': return p.records.weekly.week === U.isoWeek() ? p.records.weekly.score : 0;
      case 'speed': { let best = null; for (const k in p.records.bestTimes) if (k.split(':')[1] === mis) best = best === null ? p.records.bestTimes[k] : Math.min(best, p.records.bestTimes[k]); return best; }

/* ---------------- Ganchos de teste e piloto automático (usados na verificação) ---------------- */
const Bot = {
  flow: null, ft: 0, gx: -1, gy: -1,
  goalFor(m, p) {
    if (m.objDone) return World.lz;
    switch (m.type) {
      case 'nests': { let best = null, bd = 1e9; for (const n of m.nests) if (!n.dead) { const d = U.dist(p.x, p.y, n.x, n.y); if (d < bd) { bd = d; best = n; } } return best; }

      case 'defense': { if (m.waveState === 'clear' && Ent.alive > 0) { let best = null, bd = 1e9; for (const e of Ent.enemies) { if (e.state === 'dying') continue; const d = U.dist(m.inst.x, m.inst.y, e.x, e.y); if (d < bd) { bd = d; best = e; } } if (best) return best; } return m.inst; }

  step(dt) {

    this.ft -= dt; if (!this.flow) this.flow = new Flow(World.w, World.h);
    const gx = (goal.x / T) | 0, gy = (goal.y / T) | 0; if (this.ft <= 0 || gx !== this.gx || gy !== this.gy) { this.flow.compute(gx, gy, World.solid); this.ft = 0.4; this.gx = gx; this.gy = gy; }
    const stayR = m.type === 'defense' && !m.objDone ? 90 : m.type === 'terminal' && m.term.started && !m.objDone ? 40 : m.type === 'elimination' && !m.objDone ? 160 : (goal === World.lz ? 20 : 26);
    // interações
    if (m.type === 'terminal' && gdist < 34 && !m.term.started) Input.pressed.add('@interact');
    if (m.type === 'recovery' && !m.objDone && m.dev && !m.dev.carried && gdist < 24) Input.pressed.add('@interact');
    if (m.objDone && U.dist(p.x, p.y, World.lz.x, World.lz.y) < CFG.extraction.radius - 6) { if (m.ex.state === 'ready') V.interact = true; return; }
    if (m.type === 'elimination' && !m.objDone && tg && td < 240) { if (td < 90) { const a = Math.atan2(p.y - tg.y, p.x - tg.x); V.mx = Math.cos(a); V.my = Math.sin(a); } return; }
    if (gdist > stayR || (m.type === 'defense' && gdist > stayR)) { const f = this.flow.dirAt(p.x, p.y, World.solid); if (f) { V.mx = f.x; V.my = f.y; } else { V.mx = (goal.x - p.x) / gdist; V.my = (goal.y - p.y) / gdist; } V.run = !tg && gdist > 200; }
    else if (tg && td < 80) { const a = Math.atan2(p.y - tg.y, p.x - tg.x); V.mx = Math.cos(a) * 0.5; V.my = Math.sin(a) * 0.5; }

    if (near < 3 && (p.hp < p.hpMax * 0.7 || ammoLow)) { let bp = null, bd2 = 260; for (const k of Ent.pickups) { if ((k.kind === 'health' && p.hp < p.hpMax * 0.7) || (k.kind === 'ammo' && ammoLow)) { const d = U.dist(p.x, p.y, k.x, k.y); if (d < bd2) { bd2 = d; bp = k; } } } if (bp) { V.mx = (bp.x - p.x) / bd2; V.my = (bp.y - p.y) / bd2; } }
    if (!tg && !V.fire) { V.aimX = p.x + (V.mx || 1) * 50; V.aimY = p.y + (V.my || 0) * 50; }
  }
};
Game.runBot = (on) => { Game.bot = on ? (dt) => Bot.step(dt) : null; if (!on) Input.virtual = null; };
window.__OLF = { spawnEnemyForTest: spawnEnemy, damageEnemyForTest: damageEnemy, Alerts, Flows, Game, Ent, World, Progress, UI, Settings, SaveSys, CFG, Spr, Render, Cam, Snd, Fx, Proj, Supports, Director, DATA: { WEAPONS, SUPPORTS, ENEMIES, MISSIONS, PLANETS, DIFFICULTIES, TECHS, ACHIEVEMENTS, SKINS, COSMETICS, RANKS }, get Mis() { return Mis; }, Bot,
  /* simula `sec` segundos sem renderizar (para testes); devolve o estado final */
  sim(sec, renderEvery = 0) { const n = Math.round(sec / CFG.step); for (let i = 0; i < n && Game.state === 'mission'; i++) { Game.updateMouse(); if (Game.bot) Game.bot(CFG.step); Mis.step(CFG.step); if (renderEvery && i % renderEvery === 0) { Render.world(Game.g); Render.hud(Game.hg); } if (Mis.over && Mis.endT <= 0) { Game.finishMission(); break; } } return { state: Game.state, time: Mis && Mis.time, over: Mis && Mis.over, success: Mis && Mis.success, kills: Mis && Mis.kills }; } };

Game.init();

})();
